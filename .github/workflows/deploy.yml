name: Build & Deploy Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build registry JSON
        run: node scripts/build-registry.mjs

      - name: Install Next.js dependencies
        working-directory: templates/poc-starter
        run: npm install --legacy-peer-deps

      - name: Build Next.js static export
        working-directory: templates/poc-starter
        run: npm run build

      - name: Merge registry JSON into Next.js output
        run: |
          cp -r public/r templates/poc-starter/out/r
          cp public/registry.json templates/poc-starter/out/registry.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: templates/poc-starter/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
